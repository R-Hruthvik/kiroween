<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Augeron</title>
    <script>
      // Apply the saved theme before first paint so a reload never flashes the other theme.
      // Mirrors src/theme.ts (key "augeron.theme", default "light", names light, dark, halloween).
      try {
        var t = localStorage.getItem("augeron.theme");
        document.documentElement.dataset.theme = t === "dark" || t === "halloween" ? t : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
