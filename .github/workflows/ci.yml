name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: web and mcp-server typecheck resolve @augeron/core through its dist output.
      - name: Build
        run: npm run build

      - name: Typecheck workspaces
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test
